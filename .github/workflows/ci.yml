name: CI - Code Quality, Format & Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  format-and-lint:
    name: Code Formatting & Linting Check
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Verify Code Formatting (dotnet format)
        run: dotnet format --verify-no-changes --verbosity normal

  build-and-test:
    name: Build App & Unit Tests
    runs-on: windows-latest
    needs: format-and-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build Solution & Desktop App (Release)
        run: dotnet build --configuration Release

      - name: Run Unit Tests with TRX Logger
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish Desktop App (Release)
        run: dotnet publish LanScreenShare.Desktop/LanScreenShare.Desktop.csproj --configuration Release --no-build --output publish/LanScreenShare.Desktop

      - name: Verify Desktop Executable
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/LanScreenShare.Desktop/LanScreenShare.Desktop.exe")) {
            throw "Desktop executable was not generated."
          }

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: "**/test-results.trx"

      - name: Upload Desktop App Build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: desktop-app-release
          path: publish/LanScreenShare.Desktop/**

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: ./installer/Build-Installer.ps1 -Version "1.0.0"

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-installer-setup
          path: installer/output/LanScreenShare-Setup.exe
